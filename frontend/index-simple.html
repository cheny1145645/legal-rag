<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>法律咨询智能问答系统 - 简化版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #0a0e1a;
            --bg-panel: #0d1224;
            --accent: #3b82f6;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: rgba(99, 179, 237, 0.12);
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 14px;
            font-weight: 700;
        }

        .logo-sub {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
        }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
        }

        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .welcome {
            text-align: center;
            padding-top: 100px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome p {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .status-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        .status-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .status-card h3 {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .status-card .value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">⚖️</div>
                <div class="logo-text">
                    <span class="logo-title">法律智能问答</span>
                    <span class="logo-sub">Legal AI Assistant</span>
                </div>
            </div>

            <div class="nav-menu">
                <div class="nav-item active">法律问答</div>
                <div class="nav-item">知识库管理</div>
                <div class="nav-item">数据统计</div>
                <div class="nav-item">系统介绍</div>
            </div>
        </div>

        <div class="main-content">
            <div class="welcome">
                <h1>欢迎使用法律智能问答系统</h1>
                <p>基于 RAG 技术的智能法律咨询平台</p>

                <div class="status-cards">
                    <div class="status-card">
                        <h3>系统状态</h3>
                        <div class="value">✓ 正常</div>
                    </div>
                    <div class="status-card">
                        <h3>知识库</h3>
                        <div class="value" id="doc-count">加载中...</div>
                    </div>
                    <div class="status-card">
                        <h3>AI 模型</h3>
                        <div class="value">DeepSeek-R1</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 测试 API 连接
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                document.getElementById('doc-count').textContent = data.doc_count + ' 条';
            } catch (error) {
                document.getElementById('doc-count').textContent = '错误';
                console.error('API error:', error);
            }
        }

        // 页面加载完成后执行
        window.addEventListener('DOMContentLoaded', () => {
            console.log('=== 简化版页面加载完成 ===');
            loadStats();
        });
    </script>
</body>
</html>
